# Runs on every push and pull request: engine tests, build, internal link/SEO checks.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-engine.js
      - run: node build.js
      - run: node scripts/check-site.js
