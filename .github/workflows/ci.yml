# Runs on every push and pull request: engine tests, build, internal link/SEO checks.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-engine.js
      - run: node scripts/test-practice.js
      - run: node build.js
      - run: node scripts/check-site.js
  championship:
    # Championship rules, API, anti-cheat, month closing and load test (needs node:sqlite, Node 22+).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-championship.mjs
  print:
    # Prints every worksheet (all counts, A4 and Letter, Classic and Large print, with answer key)
    # in Chromium and checks nothing is cut, overlapping, missing or out of sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.63.0 jsqr@1.4.0 && npx playwright install --with-deps chromium
      - run: node scripts/test-qr.js
      - run: node build.js
      - run: node scripts/test-print.js
