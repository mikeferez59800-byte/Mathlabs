# Weekly check of the LIVE site: every sitemap URL must answer 200, unknown pages 404.
# A failed run sends you an e-mail from GitHub (Settings > Notifications > Actions).
# Set the repository variable SITE_URL (Settings > Secrets and variables > Actions > Variables).
# Note: GitHub disables scheduled workflows after 60 days without commits on public repos;
# re-enable it from the Actions tab if that happens.
name: Live site check
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-live.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}
